name: Build KRecorder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Geode CLI
        run: cargo install --git https://github.com/geode-sdk/cli --locked

      - name: Setup Geode SDK (CI profile)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\temp\gd" | Out-Null
          geode profile add --name ci "C:\temp\gd" windows
          if ($LASTEXITCODE -ne 0) { geode profile add --name ci "C:\temp\gd" win64 }
          Get-Content "$env:APPDATA\Geode\config.json" -ErrorAction SilentlyContinue | Write-Host
          # Fresh runner has no SDK - install it with explicit path and --force to avoid y/N prompt
          geode sdk install "C:\Users\runneradmin\Documents\Geode" --force
          if ($LASTEXITCODE -ne 0) { echo "y" | geode sdk install "C:\Users\runneradmin\Documents\Geode" }
          if ($LASTEXITCODE -ne 0) { echo y | geode sdk install }
          $env:GEODE_SDK = "C:\Users\runneradmin\Documents\Geode"
          echo "GEODE_SDK=C:\Users\runneradmin\Documents\Geode" >> $env:GITHUB_ENV
          echo "GEODE_SDK is $env:GEODE_SDK"
          Get-ChildItem "C:\Users\runneradmin\Documents\Geode" | Format-List
          geode sdk install-binaries
          Get-ChildItem "$env:APPDATA\Geode" -Recurse | Format-List

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        env:
          GEODE_SDK: C:\Users\runneradmin\Documents\Geode
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        env:
          GEODE_SDK: C:\Users\runneradmin\Documents\Geode
        run: cmake --build build --config Release

      - name: Find geode file
        run: Get-ChildItem -Recurse -Filter "*.geode" build | Select-Object FullName, Length | Format-List
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRecorder-geode
          path: build/**/*.geode
          if-no-files-found: error
