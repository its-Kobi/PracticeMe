name: Build KRecorder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Geode CLI
        run: cargo install --git https://github.com/geode-sdk/cli --locked

      - name: Setup Geode SDK (CI profile)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\temp\gd" | Out-Null
          geode profile add --help
          geode sdk install --help
          geode sdk install-binaries --help
          # Try different platform casings
          geode profile add "C:\temp\gd" --name ci --platform win64
          if ($LASTEXITCODE -ne 0) { geode profile add "C:\temp\gd" --name ci --platform windows }
          if ($LASTEXITCODE -ne 0) { geode profile add --name ci "C:\temp\gd" win64 }
          Get-Content "$env:APPDATA\Geode\config.json" -ErrorAction SilentlyContinue | Write-Host
          # Install SDK non-interactively (answer y) - already done, now set env for this session
          $env:GEODE_SDK = "C:\Users\runneradmin\Documents\Geode"
          echo "GEODE_SDK=C:\Users\runneradmin\Documents\Geode" >> $env:GITHUB_ENV
          echo "GEODE_SDK is $env:GEODE_SDK"
          geode sdk install-binaries
          if ($LASTEXITCODE -ne 0) { geode sdk install-binaries -p win64 }
          Get-ChildItem "$env:APPDATA\Geode" -Recurse | Format-List
          Get-ChildItem "$env:USERPROFILE\.geode" -Recurse -ErrorAction SilentlyContinue | Format-List
          Get-ChildItem "C:\Users\runneradmin\Documents\Geode" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName -First 20 | Format-List

      - name: Configure
        env:
          GEODE_SDK: C:\Users\runneradmin\Documents\Geode
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        env:
          GEODE_SDK: C:\Users\runneradmin\Documents\Geode
        run: cmake --build build --config Release

      - name: Find geode file
        run: Get-ChildItem -Recurse -Filter "*.geode" build | Select-Object FullName, Length | Format-List
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRecorder-geode
          path: build/**/*.geode
          if-no-files-found: error
