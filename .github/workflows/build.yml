name: Build KRecorder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Geode CLI
        run: cargo install --git https://github.com/geode-sdk/cli --locked

      - name: Setup Geode SDK (create dummy profile for CI)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Geode" | Out-Null
          @'
          {
            "profiles": [
              {
                "name": "ci",
                "path": "C:\temp\gd",
                "executable": "GeometryDash.exe"
              }
            ]
          }
          '@ | Set-Content -Path "$env:APPDATA\Geode\config.json" -Encoding utf8
          New-Item -ItemType Directory -Force -Path "C:\temp\gd" | Out-Null
          Get-Content "$env:APPDATA\Geode\config.json"
          geode sdk install-binaries
          geode sdk list
          Get-ChildItem "$env:APPDATA\Geode" -Recurse | Format-List

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Find geode file
        run: Get-ChildItem -Recurse -Filter "*.geode" build | Select-Object FullName, Length | Format-List
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRecorder-geode
          path: build/**/*.geode
          if-no-files-found: error
