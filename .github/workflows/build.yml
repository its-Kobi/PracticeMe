name: Build KRecorder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Geode CLI
        run: cargo install --git https://github.com/geode-sdk/cli --locked

      - name: Setup Geode SDK (CI profile)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\temp\gd" | Out-Null
          geode profile add --name ci "C:\temp\gd" Win64
          if ($LASTEXITCODE -ne 0) {
            geode profile add --name ci "C:\temp\gd"
          }
          Get-Content "$env:APPDATA\Geode\config.json" -ErrorAction SilentlyContinue | Write-Host
          Get-ChildItem "$env:APPDATA\Geode" -Recurse -ErrorAction SilentlyContinue | Format-List
          geode sdk install-binaries
          Get-ChildItem "$env:APPDATA\Geode" -Recurse | Format-List

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Find geode file
        run: Get-ChildItem -Recurse -Filter "*.geode" build | Select-Object FullName, Length | Format-List
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRecorder-geode
          path: build/**/*.geode
          if-no-files-found: error
